plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shijia.oledmotionguard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shijia.oledmotionguard'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
